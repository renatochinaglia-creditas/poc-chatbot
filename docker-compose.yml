services:
  chatbot_app:
    container_name: chatbot
    build: ./chatbot/app
    ports:
      - "${STREAMLIT_PORT}:${STREAMLIT_PORT}"
    environment:
      - STREAMLIT_PORT=${STREAMLIT_PORT:-8501}
      - STREAMLIT_URL=${STREAMLIT_URL:-0.0.0.0}
      - FASTAPI_PORT=${FASTAPI_PORT:-8000}
      - FASTAPI_BASE_URL=${FASTAPI_BASE_URL:-http://api}
    command:
      [
        "sh",
        "-c",
        "streamlit run app.py --server.port=${STREAMLIT_PORT:-8501}
          --server.address=${STREAMLIT_URL:-0.0.0.0}",
      ]
    depends_on:
      - backend_api
    volumes:
      - ./chatbot/app:/app
    networks:
      - llm_app
  llm:
    container_name: locallama
    image: ollama/ollama:0.21.2
    ports:
      - "127.0.0.1:11435:11434"
    environment:
      - LLM_MODEL=${LLM_MODEL}
      - MODEL=${LLM_MODEL}
    volumes:
      - ollama_models:/root/.ollama
      - ./corp-ca.pem:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - llm_app
    deploy:
      resources:
        limits:
          memory: 4GiB
  backend_api:
    container_name: api
    build: ./backend_api/app
    ports:
      - "${FASTAPI_PORT}:${FASTAPI_PORT:-8000}"
    volumes:
      - ./backend_api/app:/app
      - ./corp-ca.pem:/etc/ssl/corp-ca.pem:ro
    environment:
      - FASTAPI_PORT=${FASTAPI_PORT:-8000}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal}
      - LLM_PORT=${LLM_PORT:-11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_DEFAULT_PORT=${OLLAMA_DEFAULT_PORT:-11434}
      - DD_ENV=${DD_ENV:-staging}
      - DD_SERVICE=${DD_SERVICE:-quantumhound-api}
      - DD_VERSION=${DD_VERSION:-1.0.0}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_API_KEY=${DD_API_KEY}
      - SSL_CERT_FILE=/etc/ssl/corp-ca.pem
      - REQUESTS_CA_BUNDLE=/etc/ssl/corp-ca.pem
      - DD_LLMOBS_ENABLED=1
      - DD_LLMOBS_ML_APP=quantumhound-chatbot
      - DD_LLMOBS_AGENTLESS_ENABLED=1
    command:
      [
        "sh",
        "-c",
        "ddtrace-run uvicorn app:app --host ${FASTAPI_HOST} --port ${FASTAPI_PORT:-8000}
          --reload",
      ]
    restart: on-failure
    depends_on:
      - llm
    networks:
      - llm_app

  text_embedder:
    container_name: text-embedder
    image: ollama/ollama:0.21.2
    ports:
      - "${EMBED_PORT}:${OLLAMA_DEFAULT_PORT}"
    environment:
      - EMBED_MODEL=${EMBED_MODEL}
      - MODEL=${EMBED_MODEL}
    volumes:
      - ollama_models:/root/.ollama
      - ./corp-ca.pem:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - llm_app
  vector_store:
    container_name: vector-store
    image: chromadb/chroma:1.5.8
    ports:
      - "${CHROMADB_PORT}:8000"
    environment:
      - ANONYMIZED_TELEMETRY=false
    volumes:
      - ./chroma_data:/chroma/data # Persistent storage for embeddings
    networks:
      - llm_app
  kb_service:
    container_name: kb-service
    build: ./kb-service
    command: ["tail", "-f", "/dev/null"]
    environment:
      - EMBED_PORT=${OLLAMA_DEFAULT_PORT:-11434}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-http://text-embedder}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text:v1.5}
      - CHROMADB_PORT=${CHROMADB_PORT:-8000}
      - CHROMADB_HOST=${CHROMADB_HOST:-vector-store}
      - CHROMA_DATA_DIR=/chroma/data
      - KB_DATA_DIR=./kb-data
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANONYMIZED_TELEMETRY=false
      - SSL_CERT_FILE=/etc/ssl/corp-ca.pem
      - REQUESTS_CA_BUNDLE=/etc/ssl/corp-ca.pem
      # Add Datadog env vars for Agent Observability here
      - DD_SITE=${DD_SITE}
      - DD_API_KEY=${DD_API_KEY}
      - DD_LLMOBS_ML_APP=quantumhound-chatbot
      - DD_LLMOBS_AGENTLESS_ENABLED=1
      - DD_ENV=${DD_ENV:-qh-local}
      - DD_SERVICE=${DD_SERVICE:-quantumhound-kb}
      - DD_VERSION=${DD_VERSION:-1.0.0}
    volumes:
      - ./kb-service:/app
      - ./chroma_data:/chroma/data
      - ./corp-ca.pem:/etc/ssl/corp-ca.pem:ro
    depends_on:
      - text_embedder
      - vector_store
    networks:
      - llm_app

volumes:
  ollama_models:

networks:
  llm_app:
    name: llm_app
    driver: bridge
